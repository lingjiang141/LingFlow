<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LingFlow · 桌宠</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <main id="stage" class="stage">
    <header id="overview" class="overview surface" hidden>
      <div class="heading">
        <span class="brand"><i class="brand-mark">◈</i>LINGFLOW</span>
        <span id="connection" class="connection">实时同步</span>
        <div class="heading-tools">
          <button id="open-folder" class="tool-btn" type="button" title="打开项目文件夹" aria-label="打开项目文件夹" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 4.2c0-.7.5-1.2 1.2-1.2h3.1l1.2 1.4H13c.7 0 1.2.5 1.2 1.2v6.6c0 .7-.5 1.2-1.2 1.2H3c-.7 0-1.2-.5-1.2-1.2V4.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
          <button id="open-cmd" class="tool-btn" type="button" title="在项目目录打开 CMD 终端" aria-label="在项目目录打开 CMD 终端" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="2.6" width="12.4" height="10.8" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.6 6.2 7 8 4.6 9.8M8.3 10.2h3.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="close" aria-label="收起状态概览">×</button>
        </div>
      </div>
      <div class="overview-body">
        <div class="overview-main">
          <div class="selectors"><select id="project" aria-label="项目"></select><span class="divider">/</span><select id="spec" aria-label="Spec"></select></div>
          <div class="progress-line"><span id="progress-label">尚无已登记规格</span></div>
          <div class="progress-track"><div id="progress-fill"></div><div id="progress-accepted"></div></div>
          <div class="legend"><span class="legend-closed">已收口</span><span class="legend-accepted">已验收</span></div>
        </div>
        <div id="ring" class="ring"><strong id="percentage">0<span>%</span></strong></div>
      </div>
    </header>
    <div class="orbit" aria-hidden="true" hidden><i></i><i></i><i></i></div>
    <div id="pet-wrap" class="pet-wrap">
      <button id="pet" aria-label="查看当前 Spec 进度；按住拖动，右键更换形象" aria-expanded="false"><canvas id="sprite" width="184" height="170"></canvas></button>
      <div id="pet-caption" class="pet-caption"><span class="live-dot"></span><span id="caption">LingFlow</span></div>
      <p id="gesture-hint" hidden>单击收起 · 拖动移位 · 右键换形象</p>
    </div>
    <section id="closed" class="ticket-group surface closed" hidden aria-label="已收口的票"><h2><span class="sequence">01</span><span>已收口</span><b>0</b></h2><div class="tickets"></div></section>
    <section id="active" class="ticket-group surface active" hidden aria-label="开发中的票"><h2><span class="sequence">02</span><span>开发中</span><b>0</b></h2><div class="tickets"></div></section>
    <section id="waiting" class="ticket-group surface waiting" hidden aria-label="等待准入的票"><h2><span class="sequence">03</span><span>等待准入</span><b>0</b></h2><div class="tickets"></div></section>
  </main>
  <script type="module" src="pet.js"></script>
</body>
</html>
